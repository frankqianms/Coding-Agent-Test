# config.properties - Application Configuration File
# 
# This file contains configuration settings for the application
# Located in: src/utils/config.properties
# 
# Comments in properties files start with # or !
# This demonstrates how to add comments to configuration files in subdirectories

# Application Settings
app.name=Coding Agent Test
app.version=1.0.0
app.description=A test repository demonstrating file commenting

# Environment Settings
environment=development
debug.enabled=true

# Output Settings
output.format=text
output.verbose=false
